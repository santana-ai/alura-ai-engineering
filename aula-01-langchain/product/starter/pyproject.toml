[project]
name = "clinica-alura"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "click>=8.1",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
clinica-alura = "clinica_alura.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinica_alura"]
